<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

<body style="background-color: black; color: white;">

<audio id="sound">
    <source src="watching.mp3" type="audio/mpeg">
</audio>

<div style="height: 1500px;"></div>

<p style="text-align: center; color: white; font-size: 28px; font-family: 'VT323', monospace; letter-spacing: 8px;">the eye has opened</p>

<script>
var played = false;

document.onclick = function() {
    if (played == false) {
        document.getElementById("sound").play();
        played = true;
    }
}
</script>

</body>
</html>
