<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>

<body style="background-color: black; color: white;">

<audio id="sound">
    <source src="watching.mp3" type="audio/mpeg">
</audio>

<div style="height: 50000px;"></div>


<script>
var played = false;

document.onclick = function() {
    if (played == false) {
        document.getElementById("sound").play();
        played = true;
    }
}
</script>

</body>
</html>
