<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="background: black; margin: 0; height: 300vh;">

    <audio id="sound" src="watching.mp3"></audio>

    <script>
        document.onclick = function() {
            document.getElementById("sound").play();
            document.onclick = null;
        };

        window.onscroll = function() {
            document.body.style.height = (window.scrollY + window.innerHeight * 3) + "px";
        };
    </script>

</body>
</html>
