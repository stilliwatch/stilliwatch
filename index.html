<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>

<body style="background-color: black; color: white;">

<audio id="sound">
    <source src="watching.mp3" type="audio/mpeg">
</audio>

<div style="height: 10000px;"></div>

<p style="text-align: center; color: #888; font-size: 16px; font-family: monospace; letter-spacing: 8px;">the eye has opened.</p>
<script>
var played = false;

document.onclick = function() {
    if (played == false) {
        document.getElementById("sound").play();
        played = true;
    }
}
</script>

</body>
</html>
